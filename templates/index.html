<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校園設備報修系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <header>
        <div class="topbar">
          <p class="eyebrow">MIS 前後端範例</p>
          <a class="admin-link" href="/admin">前往管理後台</a>
        </div>
        <h1>校園設備報修系統</h1>
        <p>填寫報修資料，送出後由 Python 後端建立案件。</p>
      </header>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">建立報修單</h2>
        <p class="configuration-note">大樓、設備與問題選項尚待確認；標示「測試」的選項僅供課堂測試，非正式資料。</p>
        <form id="ticket-form">
          <label>
            大樓
            <select name="building" required>
              <option value="">請選擇大樓</option>
              {% for value, label in options.buildings %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            教室／詳細位置
            <input name="classroom" placeholder="請輸入教室或詳細位置" required />
          </label>
          <label>
            設備
            <select name="equipment" required aria-controls="equipment-other-field">
              <option value="">請選擇設備</option>
              {% for value, label in options.equipment %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </label>
          <label id="equipment-other-field" hidden>
            自訂設備
            <input name="equipment_other" disabled />
          </label>
          <label>
            緊急程度
            <select name="urgency">
              <option value="一般">一般</option>
              <option value="急件">急件</option>
              <option value="緊急">緊急</option>
            </select>
          </label>
          <label>
            姓名
            <input name="contact_name" autocomplete="name" required />
          </label>
          <label>
            電子郵件
            <input name="contact_email" type="email" autocomplete="email" pattern="{{ email_pattern }}" placeholder="name@example.com" title="請輸入完整電子郵件，例如 name@example.com" required />
          </label>
          <label>
            問題描述
            <select name="description" required aria-controls="description-other-field">
              <option value="">請選擇問題描述</option>
              {% for value, label in options.description %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </label>
          <label id="description-other-field" hidden>
            自訂問題描述
            <textarea name="description_other" rows="4" disabled></textarea>
          </label>
          <button type="submit">送出報修</button>
        </form>
        <p id="message" class="message" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="section-heading">
          <h2 id="list-title">目前案件</h2>
          <button id="refresh-button" class="secondary" type="button">重新整理</button>
        </div>
        <p id="empty-state">目前尚無報修案件。</p>
        <div class="table-wrap">
          <table id="ticket-table" hidden>
            <thead>
              <tr>
                <th>編號</th>
                <th>地點</th>
                <th>設備</th>
                <th>緊急程度</th>
                <th>狀態</th>
                <th>問題描述</th>
                <th>建立時間</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
